name: applify_market
version: "0.1.0"
profile: applify

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Read-only role for BI tools (D23): may read the marts, nothing else.
on-run-start:
  - "{{ create_reader_role() }}"

models:
  applify_market:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      +grants:
        select: [applify_reader]

