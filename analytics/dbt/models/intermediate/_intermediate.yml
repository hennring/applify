version: 2

models:
  - name: int_job_lifespans
    description: "First and last sighting per job (grain: job)."
    columns:
      - name: job_id
        data_tests: [unique, not_null]
      - name: last_seen_at
        data_tests: [not_null]
  - name: int_job_scope
    columns:
      - name: job_id
        data_tests: [unique, not_null]
      - name: scope
        data_tests:
          - accepted_values:
              arguments:
                values: [germany, abroad, unknown]
  - name: int_job_profile_distance
    description: "Distance of each job to a user's nearest place and whether it is within a radius (grain: user, job)."
  - name: int_job_sources
    columns:
      - name: job_id
        data_tests: [unique, not_null]
