version: 2

models:
  - name: stg_raw__job_sightings
    columns:
      - name: sighting_id
        data_tests: [unique, not_null]
  - name: stg_raw__job_versions
    columns:
      - name: content_hash
        data_tests: [unique, not_null]
  - name: stg_app__job_sources
    columns:
      - name: job_source_id
        data_tests: [unique, not_null]
      - name: job_id
        data_tests: [not_null]
  - name: stg_app__jobs
    columns:
      - name: job_id
        data_tests: [unique, not_null]
  - name: stg_features__job_features
    columns:
      - name: job_id
        data_tests: [unique, not_null]
      - name: seniority
        data_tests:
          - accepted_values:
              arguments:
                values: [student, junior, mid, senior, lead]
      - name: salary_min_eur
        data_tests:
          - value_range:
              arguments:
                min_value: 15000
                max_value: 300000
      - name: vacation_days
        data_tests:
          - value_range:
              arguments:
                min_value: 20
                max_value: 40
  - name: stg_features__skill_taxonomy
    columns:
      - name: skill
        data_tests: [unique, not_null]
  - name: stg_features__role_families
    columns:
      - name: role_family
        data_tests: [unique, not_null]
  - name: stg_features__profile_role_families
  - name: stg_features__states
    columns:
      - name: state_code
        data_tests: [unique, not_null]
  - name: stg_features__job_regions
    columns:
      - name: job_id
        data_tests: [unique, not_null]
      - name: state_code
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_features__states')
                field: state_code
  - name: stg_app__profile_skills
  - name: stg_app__profile_locations
