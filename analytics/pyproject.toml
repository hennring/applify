[project]
name = "applify-analytics"
version = "0.1.0"
description = "Market analysis pipeline of Applify: feature extraction, dbt models, Dagster orchestration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "applify>=0.1.0",
    "dagster>=1.13.27",
    "dagster-dbt>=0.29.27",
    "dagster-webserver>=1.13.27",
    "dbt-core>=1.12.6",
    "dbt-postgres>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["applify_analytics"]

[tool.uv.sources]
applify = { path = "../backend", editable = true }

[tool.dagster]
module_name = "applify_analytics.definitions"
code_location_name = "applify_analytics"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dagster_dbt.*", "dbt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
